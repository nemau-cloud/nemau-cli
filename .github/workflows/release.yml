name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Cross-compiled statically: the CLI ships to CI runners and workstations
      # that have no Go toolchain and, on Alpine images, no libc we can link
      # against.
      - name: Build
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "dist/nemau-$os-$arch$ext" ./cmd/nemau
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
